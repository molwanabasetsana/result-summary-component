<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="style.css">


  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="container">

    <div class="result-section">
        <h3>Your Result</h3>

        <div class="score-circle">
            <h1>76</h1>
            <p>of 100</p>
        </div>

        <h2>Great</h2>

        <p class="description">
            You scored higher than 65% of the people who have taken these tests.
        </p>
    </div>

    <div class="summary-section">
        <h3>Summary</h3>

        <div class="score reaction">
    <div class="category">
        <img src="./assets/images/icon-reaction.svg" alt="Reaction Icon">
        <span>Reaction</span>
    </div>

    <span><strong>80</strong> / 100</span>
</div>

        <div class="score memory">
            <div class="category">
              <img src="./assets/images/icon-memory.svg" alt="Memory Icon">
              <span>Memory</span>
            </div>

            <span><strong>92</strong> / 100</span>
        </div>

        <div class="score verbal">
          <div class="category">
            <img src="./assets/images/icon-verbal.svg" alt="Verbal Icon">
            <span>Verbal</span>
          </div>
            
            <span><strong>61</strong> / 100</span>
        </div>

        <div class="score visual">
          <div class="category">
            <img src="./assets/images/icon-visual.svg" alt="Visual Icon">
            <span>Visual</span>
          </div>
            
            <span><strong>72</strong> / 100</span>
        </div>

        <button>Continue</button>
    </div>

</div>
  
</body>
</html>
